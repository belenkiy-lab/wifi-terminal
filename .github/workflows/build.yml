name: Build firmware

on:
  push:
    branches:
      - master
      - agent/**
  pull_request:

jobs:
  platformio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build firmware
        run: pio run

      - name: Build SPIFFS image
        run: pio run --target buildfs

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wifi-terminal-d1-mini
          path: |
            .pio/build/d1_mini/firmware.bin
            .pio/build/d1_mini/spiffs.bin
          if-no-files-found: error
