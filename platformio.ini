; PlatformIO Project Configuration File
;
; Reproducible build configuration for the ESP8266/Wemos D1 mini firmware.

[env:d1_mini]
platform = platformio/espressif8266 @ 4.2.1
board = d1_mini
framework = arduino

upload_speed = 57600
monitor_speed = 9600

; LittleFS replaces deprecated SPIFFS in the ESP8266 Arduino core.
board_build.filesystem = littlefs
extra_scripts = pre:scripts/web_assets.py

lib_deps =
    bblanchon/ArduinoJson @ 6.21.5
    xreef/SimpleFTPServer @ 3.0.1
    links2004/WebSockets @ 2.7.3
