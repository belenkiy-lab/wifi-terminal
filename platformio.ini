; PlatformIO Project Configuration File
;
; Reproducible build configuration for the ESP8266/Wemos D1 mini firmware.

[env:d1_mini]
platform = platformio/espressif8266 @ 4.2.1
board = d1_mini
framework = arduino

upload_speed = 57600
monitor_speed = 9600

; Keep the original SPIFFS layout used by the firmware and data directory.
board_build.filesystem = spiffs

lib_deps =
    bblanchon/ArduinoJson @ 6.21.5
    nailbuster/ESP8266FtpServer @ 1.0.1
    links2004/WebSockets @ 2.7.3
