<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wireless Terminal</title>
    <link rel="stylesheet" href="xterm.css" />
    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background: #000;
            color: #ddd;
            font-family: sans-serif;
        }

        #status {
            box-sizing: border-box;
            min-height: 28px;
            padding: 5px 8px;
            background: #181818;
            color: #aaa;
            font: 12px/18px sans-serif;
        }

        #status.connected {
            color: #7fd47f;
        }

        #status.error {
            color: #ff7777;
        }

        #terminal-wrap {
            overflow: auto;
            padding: 6px;
        }

        #terminal {
            display: inline-block;
            min-width: 100%;
        }
    </style>
</head>
<body>
    <div id="status">WebSocket: connecting...</div>
    <div id="terminal-wrap">
        <div id="terminal"></div>
    </div>

    <script src="xterm.js"></script>
    <script>
        const WEBSOCKET_PORT = 81;
        const statusElement = document.getElementById('status');
        const encoder = new TextEncoder();

        const terminal = new Terminal({
            cols: 80,
            rows: 24,
            cursorBlink: true,
            convertEol: false,
            scrollback: 1000,
            fontFamily: 'Consolas, "Courier New", monospace',
            fontSize: 14,
            theme: {
                background: '#000000'
            }
        });

        terminal.open(document.getElementById('terminal'));
        terminal.focus();

        const connection = new WebSocket(`ws://${location.hostname}:${WEBSOCKET_PORT}/`);
        connection.binaryType = 'arraybuffer';

        function setStatus(text, state) {
            statusElement.textContent = text;
            statusElement.className = state || '';
        }

        function sendBytes(bytes) {
            if (connection.readyState === WebSocket.OPEN) {
                connection.send(bytes);
            }
        }

        connection.onopen = function () {
            setStatus('WebSocket: connected', 'connected');
            terminal.focus();
        };

        connection.onmessage = function (event) {
            if (event.data instanceof ArrayBuffer) {
                terminal.write(new Uint8Array(event.data));
                return;
            }

            if (event.data instanceof Blob) {
                event.data.arrayBuffer().then(function (buffer) {
                    terminal.write(new Uint8Array(buffer));
                });
                return;
            }

            // Backward compatibility with text frames from older firmware.
            terminal.write(String(event.data));
        };

        connection.onclose = function (event) {
            setStatus(
                `WebSocket: closed (code ${event.code}${event.reason ? ', ' + event.reason : ''})`,
                event.wasClean ? '' : 'error'
            );
        };

        connection.onerror = function () {
            setStatus('WebSocket: connection error', 'error');
        };

        // xterm emits both keyboard input and terminal-generated replies here
        // (for example device-status and cursor-position reports).
        terminal.onData(function (data) {
            sendBytes(encoder.encode(data));
        });

        // Legacy mouse-reporting modes can contain raw 8-bit values.
        terminal.onBinary(function (data) {
            const bytes = new Uint8Array(data.length);
            for (let i = 0; i < data.length; i++) {
                bytes[i] = data.charCodeAt(i) & 0xff;
            }
            sendBytes(bytes);
        });

        window.addEventListener('focus', function () {
            terminal.focus();
        });
    </script>
</body>
</html>
